name: Changeset Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  create-changeset:
    # The workflow needs a Cursor API key and write access to the PR branch.
    # Keep it on same-repository PRs so untrusted fork code cannot receive
    # repository secrets or push changes back through this job.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Full history gives the script a reliable origin/main...HEAD diff.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create missing changeset
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: composer-2
          CHANGESET_BASE_REF: origin/main
        run: bun run changeset:agent

      - name: Commit changeset
        run: |
          # The agent is constrained to changesets, and the commit step enforces
          # that contract by staging only the .changeset directory.
          if git diff --quiet -- .changeset; then
            echo "No changeset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset
          git commit -m "Add changeset"
          git push
